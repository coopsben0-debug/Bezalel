<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home | Bezalel</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        body { 
            /* Real rich wood grain gradient effect using deep mahogany/walnut tones */
            background-color: #2c1a0e;
            background-image: 
                radial-gradient(circle at 50% 40%, rgba(92, 58, 33, 0.6) 0%, rgba(25, 14, 7, 0.95) 80%),
                repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0, 0, 0, 0.15) 40px, rgba(0, 0, 0, 0.15) 80px),
                linear-gradient(135deg, #3d2311 0%, #1a0e06 50%, #291508 100%);
            color: #f4ebd0; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .top-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 25px 50px; 
            border-bottom: 2px solid #d4af37; /* Metallic Gold border */
            background: rgba(20, 11, 5, 0.85);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        .top-bar a { 
            text-decoration: none; 
            color: #d4af37; /* Gold */
            font-weight: 600; 
            font-size: 1.05em;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s ease; 
        }
        
        .top-bar a:hover {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(212,175,55,0.6);
        }
        
        .hero { 
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            text-align: center; 
            padding: 40px 20px; 
        }
        
        /* Elegant Gold framing lines around the brand name */
        .brand-wrapper {
            position: relative;
            padding: 20px 60px;
            border-top: 2px solid #d4af37;
            border-bottom: 2px solid #d4af37;
            background: rgba(15, 8, 3, 0.4);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 4px;
        }
        
        .brand-name { 
            font-family: 'Playfair Display', serif; 
            font-style: italic; 
            font-size: 6.5em; 
            color: #8a9a5b; /* Rich Olive Green */
            margin: 0; 
            text-shadow: 2px 4px 12px rgba(0,0,0,0.9);
            letter-spacing: 2px;
        }
        
        .gallery-btn { 
            display: inline-block; 
            margin-top: 60px; 
            padding: 18px 45px; 
            background: #182613; /* Deep Olive backing */
            color: #d4af37; /* Gold Text */
            text-decoration: none; 
            border-radius: 4px; 
            font-weight: bold; 
            font-size: 1.1em;
            letter-spacing: 1px;
            border: 2px solid #d4af37; /* Gold border */
            box-shadow: 0 6px 25px rgba(0,0,0,0.7);
            transition: all 0.3s ease; 
        }
        
        .gallery-btn:hover { 
            background: #d4af37; 
            color: #1a0e06; 
            box-shadow: 0 8px 30px rgba(212,175,55,0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="mailto:bezalel.studio.co@outlook.com">Contact Us</a>
        <div>
            <a href="index.html">Home</a> &nbsp;&nbsp;|&nbsp;&nbsp; <a href="art.html">Shop Art</a>
        </div>
    </div>
    
    <main class="hero">
        <div class="brand-wrapper">
            <h1 class="brand-name">Bezalel</h1>
        </div>
        <div>
            <a href="art.html" class="gallery-btn">View Our Collection</a>
        </div>
    </main>
</body>
</html>
