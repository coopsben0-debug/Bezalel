<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home | Bezalel</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        body { 
            /* Rich dark wood/tree bark texture gradient combined with deep olive tones */
            background-color: #121c14;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(20, 35, 22, 0.85) 0%, rgba(8, 15, 10, 0.95) 100%),
                url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.8 0.05" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%\" height="100%\" filter="url(%23noiseFilter)" opacity="0.15"/></svg>');
            color: #d4dfc7; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 0; 
        }
        .top-bar { 
            display: flex; 
            justify-content: space-between; 
            padding: 20px 40px; 
            border-bottom: 1px solid rgba(131, 153, 88, 0.3); 
            background: rgba(10, 25, 15, 0.6);
            backdrop-filter: blur(5px);
        }
        .top-bar a { 
            text-decoration: none; 
            color: #d4dfc7; 
            font-weight: 600; 
            transition: color 0.2s;
        }
        .top-bar a:hover {
            color: #d4af37;
        }
        .hero { 
            text-align: center; 
            padding: 120px 20px; 
        }
        .brand-name { 
            font-family: 'Playfair Display', serif; 
            font-style: italic; 
            font-size: 6em; 
            color: #d4af37; /* Metallic Gold */
            margin: 0; 
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        .welcome-text { 
            font-size: 1.4em; 
            color: #b5c4a3; 
            margin-top: 15px; 
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 300;
        }
        .gallery-btn { 
            display: inline-block; 
            margin-top: 50px; 
            padding: 16px 45px; 
            background: #233824; 
            color: #d4af37; 
            text-decoration: none; 
            border-radius: 4px; 
            font-weight: bold; 
            border: 1px solid #d4af37;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: all 0.3s ease; 
        }
        .gallery-btn:hover { 
            background: #d4af37; 
            color: #0a1c10; 
            box-shadow: 0 6px 25px rgba(212,175,55,0.3);
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="mailto:bezalel.studio.co@outlook.com">Contact Us</a>
        <div>
            <a href="index.html">Home</a> &nbsp;|&nbsp; <a href="art.html">Art Gallery</a>
        </div>
    </div>
    <main class="hero">
        <h1 class="brand-name">Bezalel</h1>
        <p class="welcome-text">Master Craftsmanship & Fine Art</p>
        <a href="art.html" class="gallery-btn">View Our Collection</a>
    </main>
</body>
</html>
