<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home | Bezalel</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        body { 
            /* Deep rich dark wooden bark background texture with warm natural tones */
            background-color: #16110a;
            background-image: 
                linear-gradient(rgba(15, 10, 6, 0.82), rgba(25, 17, 10, 0.88)),
                repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0, 0, 0, 0.25) 3px, rgba(0, 0, 0, 0.25) 6px),
                radial-gradient(ellipse at 50% 30%, rgba(60, 40, 20, 0.4) 0%, rgba(10, 7, 4, 0.8) 100%);
            color: #d4dfc7; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 0; 
        }
        .top-bar { 
            display: flex; 
            justify-content: space-between; 
            padding: 22px 40px; 
            border-bottom: 2px solid #d4af37; /* Gold top border line */
            background: rgba(12, 8, 5, 0.75);
            backdrop-filter: blur(5px);
        }
        .top-bar a { 
            text-decoration: none; 
            color: #d4af37; /* Gold navigation text */
            font-weight: 600; 
            letter-spacing: 0.5px;
            transition: color 0.2s;
        }
        .top-bar a:hover {
            color: #ffffff;
        }
        .hero { 
            text-align: center; 
            padding: 140px 20px; 
        }
        
        /* Gold lines flanking or framing the brand name */
        .brand-container {
            display: inline-block;
            position: relative;
            padding: 0 40px;
        }
        .brand-container::before, .brand-container::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 80px;
            height: 2px;
            background: #d4af37;
        }
        .brand-container::before { right: 100%; }
        .brand-container::after { left: 100%; }

        .brand-name { 
            font-family: 'Playfair Display', serif; 
            font-style: italic; 
            font-size: 6.5em; 
            color: #839958; /* Olive green text */
            margin: 0; 
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        
        .gallery-btn { 
            display: inline-block; 
            margin-top: 60px; 
            padding: 16px 45px; 
            background: rgba(15, 25, 17, 0.85); 
            color: #d4af37; 
            text-decoration: none; 
            border-radius: 4px; 
            font-weight: bold; 
            border: 2px solid #d4af37; /* Gold border */
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            transition: all 0.3s ease; 
        }
        .gallery-btn:hover { 
            background: #d4af37; 
            color: #120d08; 
            box-shadow: 0 6px 25px rgba(212,175,55,0.4);
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="mailto:bezalel.studio.co@outlook.com">Contact Us</a>
        <div>
            <a href="index.html">Home</a> &nbsp;|&nbsp; <a href="art.html">Shop Art</a>
        </div>
    </div>
    <main class="hero">
        <div class="brand-container">
            <h1 class="brand-name">Bezalel</h1>
        </div>
        <div>
            <a href="art.html" class="gallery-btn">View Our Collection</a>
        </div>
    </main>
</body>
</html>
